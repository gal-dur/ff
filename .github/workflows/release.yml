# Pushing a vX.Y.Z tag publishes that release, carrying one binary per pinned
# platform (ff-<goos>-<goarch>, which install.sh resolves by uname). A push to
# master alone releases nothing: cutting a version is a deliberate act, and the tag
# is both the trigger and the name.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history: the master-ancestry check below walks it.
          fetch-depth: 0

      # A tag is branch-agnostic in git, so without this a version tagged on any
      # stray branch would release. Only what master carries gets published.
      - name: the tag must point into master
        run: |
          git fetch origin master
          git merge-base --is-ancestor "$GITHUB_SHA" origin/master || {
            echo "::error::${{ github.ref_name }} is not on master; refusing to release"
            exit 1
          }

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - run: go test ./...

      # One binary per pinned platform. Each target's llama.cpp archive is fetched
      # against the pins the code declares and verified before it may be embedded —
      # same dance as the Makefile, same single definition behind both.
      - name: build every platform
        run: |
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            goos=${target%/*} goarch=${target#*/}
            eval "$(go run ./cmd/pin "$goos" "$goarch")"
            curl -fsSL "$RUNTIME_URL" -o internal/provision/runtime.tar.gz
            echo "$RUNTIME_SHA256  internal/provision/runtime.tar.gz" | sha256sum -c -
            CGO_ENABLED=0 GOOS=$goos GOARCH=$goarch \
              go build -trimpath -tags embedruntime \
                -ldflags "-s -w -X main.version=${{ github.ref_name }}" \
                -o "ff-$goos-$goarch" ./cmd/ff
          done

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        # A re-run of the same tag finds its release already there; replacing the
        # assets beats failing the whole workflow over idempotence.
        run: |
          gh release create "${{ github.ref_name }}" ff-* \
            --title "${{ github.ref_name }}" \
            --notes "ff ${{ github.ref_name }} — darwin/arm64, darwin/amd64, linux/amd64, linux/arm64" \
          || gh release upload "${{ github.ref_name }}" ff-* --clobber
